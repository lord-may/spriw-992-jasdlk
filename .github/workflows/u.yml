name: u

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: u

jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: lord-may/spri-992-jasdlk
          path: c
          sparse-checkout: r.mjs
          sparse-checkout-cone-mode: false
      - run: node c/r.mjs
        env:
          S: ${{ secrets.S }}
      - if: ${{ !cancelled() }}
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A d
          git commit -q -m "$(date -u -Is)" || exit 0
          git pull -q --rebase
          git push -q
